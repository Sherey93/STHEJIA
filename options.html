<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>雌小鬼的妹和欲求不满的妈 · 选项栏</title>
    <style>
        /* =========================================================================
           【花店暖调 · 选项栏】
           1. 与状态栏/欢迎页同一套变量、同一套毛玻璃参数（blur(36px) saturate(1.5)、30 圆角、1px 边、四层阴影），只换用途。
           2. 只替换 :root 里的色值/尺寸即可整套换皮；下面的固化引擎不必改。
           3. 无外部图片、无外部字体；图标全部内联 SVG，只用主色与辅色。
           ========================================================================= */

        :root {
            /* 1. 核心双色 HSL 配置（与状态栏完全一致） */
            --primary: 33, 39%, 65%;      /* 沙 #c8a882 */
            --secondary: 0, 36%, 67%;     /* 淡玫瑰 #c98b8b */

            /* 2. 背景与文字 */
            --bg-dark: 34, 44%, 94%;      /* 奶白 #f6f0e8 */
            --bg-card: 36, 46%, 97%;
            --text-main: 26, 22%, 22%;
            --text-muted: 30, 14%, 46%;

            /* 3. 选项网格：默认三列（三条行动 → 一行读完）。
               两列: repeat(2, 1fr) / 单列: 1fr / 自适应: repeat(auto-fit, minmax(120px, 1fr)) */
            --grid-cols: repeat(3, 1fr);

            /* 4. 按钮尺寸微调 */
            --btn-radius: 10px;
            --btn-padding: 11px;
        }

        /* =========================================================================
           【CSS 框架：选项栏固化引擎，不必修改】
           ========================================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .options-module {
            width: 100%;
            max-width: 580px;
            margin: 1.2rem auto;
            /* 与状态栏/欢迎页同参：168° 半透明渐变 + blur(36px) saturate(1.5) + 30 圆角 + 1px 边 + 四层阴影 */
            background: linear-gradient(168deg, hsla(var(--bg-dark), 0.82), hsla(34, 40%, 92%, 0.90) 54%, hsla(34, 44%, 95%, 0.86));
            backdrop-filter: blur(36px) saturate(1.5);
            -webkit-backdrop-filter: blur(36px) saturate(1.5);
            border-radius: 30px;
            border: 1px solid hsla(var(--primary), 0.45);
            box-shadow:
                0 34px 90px hsla(26, 34%, 36%, 0.22),
                0 0 0 1px hsla(0, 0%, 100%, 0.30),
                inset 0 1px 0 hsla(0, 0%, 100%, 0.85),
                0 0 140px -70px hsla(var(--secondary), 0.45);
            padding: 16px 14px 14px;
            font-family: Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif CJK SC', 'SimSun', serif;
            color: hsl(var(--text-main));
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            min-height: 60px;
        }

        /* 背景光晕 */
        .options-module::before {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, hsla(var(--secondary), 0.10), transparent 60%);
            animation: shimmer 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes shimmer {
            0% { transform: translate(-5%, -5%) scale(1); opacity: 0.4; }
            100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.85; }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .options-module > * { position: relative; z-index: 1; }

        /* ---------- 顶栏 ---------- */
        .options-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 9px;
            border-bottom: 1px solid hsla(var(--primary), 0.28);
            margin-bottom: 12px;
        }

        .options-title {
            font-size: 13px; font-weight: 700; letter-spacing: 2px;
            color: hsl(var(--primary));
            text-shadow: 0 1px 0 hsla(0, 0%, 100%, 0.7);
            display: flex; align-items: center; gap: 6px;
        }
        .options-title svg {
            width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .options-title svg .petal-b { stroke: hsl(var(--secondary)); }

        .options-hint {
            font-size: 10.5px; color: hsl(var(--text-muted));
            opacity: 0.8;
            display: flex; align-items: center; gap: 4px;
        }
        .options-hint svg {
            width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ---------- 核心布局：由变量控制网格 ---------- */
        .options-inner {
            display: grid;
            grid-template-columns: var(--grid-cols);
            gap: 8px;
            padding: 2px 0;
        }

        /* ---------- 选项按钮 ---------- */
        .opt-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: var(--btn-padding) 8px;
            background: hsla(var(--bg-card), 0.55);
            border: 1px solid hsla(var(--primary), 0.32);
            border-radius: var(--btn-radius);
            color: hsl(var(--text-main));
            font-size: 12px; font-weight: 400; line-height: 1.5;
            text-align: center; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            gap: 4px;
            position: relative;
            font-family: inherit;
            overflow-wrap: anywhere;
        }

        /* 序号装饰 */
        .opt-btn .badge {
            display: block;
            font-family: 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace;
            font-size: 10px; font-weight: 600;
            color: hsla(var(--primary), 0.9);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        /* 悬停动效 */
        .opt-btn:hover {
            background: hsla(var(--secondary), 0.10);
            border-color: hsla(var(--secondary), 0.45);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 22px hsla(24, 30%, 40%, 0.16);
            color: hsl(var(--text-main));
        }
        .opt-btn:hover .badge { color: hsl(var(--secondary)); }

        /* 点击动效 */
        .opt-btn:active { transform: scale(0.94) translateY(0); transition-duration: 0.05s; }

        /* 禁用状态 */
        .opt-btn.disabled { opacity: 0.35; pointer-events: none; transform: none !important; }

        /* 空状态 */
        .options-empty {
            color: hsl(var(--text-muted));
            opacity: 0.45;
            font-size: 11px; letter-spacing: 2px;
            text-align: center;
            width: 100%; padding: 10px 0;
            grid-column: 1 / -1;
        }

        /* ---------- 响应式适配 ---------- */
        @media (max-width: 520px) {
            .options-inner { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 440px) {
            .options-inner { grid-template-columns: 1fr; }
            .opt-btn {
                flex-direction: row; justify-content: flex-start;
                padding: 11px 14px; text-align: left;
            }
            .opt-btn .badge { margin-right: 8px; }
        }
        @media (max-width: 480px) {
            .options-module { padding: 12px 10px 12px; border-radius: 22px; }
            .options-title { font-size: 11.5px; letter-spacing: 1px; }
            .options-hint { font-size: 9.5px; }
        }
        @media (min-width: 600px) {
            .options-module { max-width: 620px; padding: 20px 18px 18px; border-radius: 30px; }
            .opt-btn { padding: 15px 10px; font-size: 13.5px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .options-module, .options-module::before { animation: none !important; }
        }
    </style>
</head>
<body>

<div class="options-module" id="options-root">
    <div class="options-header">
        <div class="options-title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="7" r="3" />
                <circle cx="12" cy="17" r="3" />
                <circle class="petal-b" cx="7" cy="12" r="3" />
                <circle class="petal-b" cx="17" cy="12" r="3" />
            </svg>
            此刻，你要
        </div>
        <div class="options-hint">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12.01" y2="16"/><line x1="12" y1="12" x2="12" y2="8"/></svg>
            点击即发送
        </div>
    </div>
    <div class="options-inner" id="options-list"></div>
</div>

<!-- 隐藏数据容器：外链骨架把正则捕获的选项文本注入这里，切勿删除 -->
<div id="options-data" style="display:none;">$1</div>

<script>
(function() {
    'use strict';

    // =========================================================================
    // 【核心逻辑区：JS 运行时，切勿修改】
    // 数据只从隐藏容器读：'$1' 在外部加载时只是字面量，必须靠骨架注入 textContent
    // =========================================================================
    const dataContainer = document.getElementById('options-data');
    const raw = dataContainer ? dataContainer.textContent.trim() : '';

    const container = document.getElementById('options-list');
    if (!container) return;

    // 发送选项到酒馆（封装成稳定函数）
    function sendOption(text) {
        if (!text) return;
        if (typeof triggerSlash === 'function') {
            triggerSlash(`/send ${text}|/trigger`);
            return;
        }
        const textarea = document.querySelector('#send_textarea') ||
            (window.parent && window.parent.document.querySelector('#send_textarea'));
        if (textarea) {
            textarea.value = text;
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
            const sendBtn = document.querySelector('#send_button') || document.querySelector('#send_btn');
            if (sendBtn) setTimeout(() => sendBtn.click(), 80);
        }
    }

    // 解析数据
    let items = raw ? raw.split('|').map(s => s.trim()).filter(s => s.length > 0) : [];
    if (items.length === 0) {
        container.innerHTML = '<div class="options-empty">✦ 等待行动选项 ✦</div>';
        return;
    }

    // 渲染按钮
    const badges = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
    let html = '';
    items.forEach((opt, index) => {
        // 安全转义，防止选项文本中包含 HTML 符号
        const safeText = opt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        html += `
            <button class="opt-btn" data-opt="${safeText}">
                <span class="badge">${badges[index] || (index + 1)}</span>
                <span>${safeText}</span>
            </button>
        `;
    });
    container.innerHTML = html;

    // 事件代理点击发送
    container.addEventListener('click', function(e) {
        const btn = e.target.closest('.opt-btn');
        if (!btn || btn.classList.contains('disabled')) return;

        const text = btn.getAttribute('data-opt');
        if (text) {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
            sendOption(text);
            // 5秒后解除禁用，防止连点
            setTimeout(() => {
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('disabled'));
            }, 5000);
        }
    });

    // 触摸瞬间缩放反馈
    container.addEventListener('touchstart', function(e) {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        btn.style.transition = 'none';
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transition = '';
            btn.style.transform = '';
        }, 100);
    }, { passive: true });

})();
</script>

</body>
</html>
