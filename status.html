<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>雌小鬼的妹和欲求不满的妈 · 状态栏</title>
    <style>
        /* =========================================================================
           【花店暖调 · 状态栏】
           1. 毛玻璃参数与欢迎页共用，只换色相：backdrop-filter: blur(36px) saturate(1.5)
              168° 半透明渐变 / 30 圆角 / 1px 细边 / 四层阴影 / 双层光晕。
           2. 配色：奶白 #f6f0e8（底）· 沙 #c8a882（主）· 淡玫瑰 #c98b8b（辅）
           3. 无外部图片、无外部字体。图标全部内联 SVG，只用主色与辅色两种颜色。
           4. 数据条：细（2px）、圆角小；数值一律等宽字。
           5. 字段以《00-确认单》为准，不增不减：环境 4 项 + 三人各 4 项 + 穿搭 + 最近接触。
           ========================================================================= */

        :root {
            /* 1. 核心双色（HSL，与选项栏完全一致） */
            --primary: 33, 39%, 65%;      /* 沙 #c8a882 */
            --secondary: 0, 36%, 67%;     /* 淡玫瑰 #c98b8b */

            /* 2. 背景与卡片 */
            --bg-dark: 34, 44%, 94%;      /* 奶白 #f6f0e8 */
            --bg-card: 36, 46%, 97%;

            /* 3. 文字 */
            --text-main: 26, 22%, 22%;
            --text-muted: 30, 14%, 46%;
            --ink: 20, 24%, 18%;          /* 等宽数值 */

            /* 4. 布局方向：母亲与妹妹左右并排，玩家卡跨两列压在下面；
                  窄屏（≤560px）自动回落成单列 */
            --layout-cols: 1fr 1fr;

            /* 5. 何锦怡头像（她缩了，所以头像框比妹妹小一截） */
            --avatar-width: 44px;
            --avatar-height: 62px;
            --avatar-radius: 10px;

            /* 6. 何宁宁头像（妹妹的框更高，对照出母亲的矮） */
            --ning-avatar-width: 54px;
            --ning-avatar-height: 74px;
            --avatar-radius-ning: 10px;

            /* 7. {{user}}头像（正圆） */
            --user-avatar-width: 40px;
            --user-avatar-height: 40px;
            --user-avatar-radius: 50%;
        }

        /* =========================================================================
           【固化引擎：以下为模板本体，改动前先想清楚】
           ========================================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .status-wrapper {
            max-width: 580px;
            margin: 1.2rem auto;
            /* 毛玻璃配方与欢迎页 .container 完全同参：168° 半透明渐变 + blur(36px) saturate(1.5) + 30 圆角 + 1px 边 + 四层阴影，只把色相从青紫换成奶白沙 */
            background: linear-gradient(168deg, hsla(var(--bg-dark), 0.82), hsla(34, 40%, 92%, 0.90) 54%, hsla(34, 44%, 95%, 0.86));
            backdrop-filter: blur(36px) saturate(1.5);
            -webkit-backdrop-filter: blur(36px) saturate(1.5);
            border-radius: 30px;
            border: 1px solid hsla(var(--primary), 0.45);
            box-shadow:
                0 34px 90px hsla(26, 34%, 36%, 0.22),
                0 0 0 1px hsla(0, 0%, 100%, 0.30),
                inset 0 1px 0 hsla(0, 0%, 100%, 0.85),
                0 0 140px -70px hsla(var(--secondary), 0.45);
            padding: 18px 16px 14px;
            font-family: Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif CJK SC', 'SimSun', serif;
            color: hsl(var(--text-main));
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            opacity: 0;
        }

        /* 双层光晕：一层玫瑰、一层沙，慢慢漂 */
        .status-wrapper::before {
            content: '';
            position: absolute; top: -34%; right: -22%;
            width: 74%; height: 84%;
            background: radial-gradient(ellipse, hsla(var(--secondary), 0.20), transparent 62%);
            pointer-events: none;
            animation: drift 14s infinite alternate ease-in-out;
            z-index: 0;
        }
        .status-wrapper::after {
            content: '';
            position: absolute; bottom: -34%; left: -22%;
            width: 66%; height: 74%;
            background: radial-gradient(ellipse, hsla(var(--primary), 0.22), transparent 62%);
            pointer-events: none;
            animation: drift 18s infinite alternate-reverse ease-in-out;
            z-index: 0;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.45; }
            100% { transform: translate(-9%, 7%) scale(1.18); opacity: 0.9; }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .status-wrapper > * { position: relative; z-index: 1; }

        /* ---------- 顶栏 ---------- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid hsla(var(--primary), 0.28);
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .header-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .header-left .floret {
            width: 15px; height: 15px; flex-shrink: 0;
            fill: none; stroke-width: 1.6;
        }
        .header-left .floret .petal-a { stroke: hsl(var(--primary)); }
        .header-left .floret .petal-b { stroke: hsl(var(--secondary)); }
        .header-left .floret .core { fill: hsl(var(--secondary)); stroke: none; opacity: 0.7; }
        .header-left .title {
            font-size: 11.5px; font-weight: 700; letter-spacing: 2px;
            color: hsl(var(--primary));
            text-shadow: 0 1px 0 hsla(0, 0%, 100%, 0.7);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .header-right { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: hsl(var(--text-muted)); }
        .header-right .loc,
        .header-right .time { display: flex; align-items: center; gap: 4px; min-width: 0; }
        .header-right .loc svg,
        .header-right .time svg {
            width: 12px; height: 12px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .header-right .loc { color: hsl(var(--text-main)); opacity: 0.78; }
        .header-right .loc span,
        .header-right .time span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
        .header-right .dot {
            width: 4px; height: 4px; border-radius: 50%;
            background: hsl(var(--secondary)); flex-shrink: 0;
            animation: pulse-dot 2.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); box-shadow: 0 0 10px hsla(var(--secondary), 0.55); }
        }

        /* ---------- 折叠按钮 ---------- */
        .fold-btn {
            background: none; border: none; padding: 0 2px; cursor: pointer;
            color: hsl(var(--text-muted)); opacity: 0.65;
            display: flex; align-items: center;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        .fold-btn:hover { color: hsl(var(--text-main)); opacity: 1; }
        .fold-btn svg {
            width: 15px; height: 15px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .status-wrapper.collapsed .fold-btn svg { transform: rotate(-90deg); }
        .status-wrapper.collapsed .header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .status-wrapper.collapsed .inner-voice-box,
        .status-wrapper.collapsed .env-strip,
        .status-wrapper.collapsed .divider,
        .status-wrapper.collapsed .cards-container,
        .status-wrapper.collapsed .intimacy-log { display: none; }

        /* ---------- 家中气氛（一句话，带引号水印） ---------- */
        .inner-voice-box {
            background: hsla(var(--bg-card), 0.58);
            border-left: 3px solid hsla(var(--secondary), 0.55);
            border-radius: 8px;
            padding: 8px 11px;
            margin-bottom: 9px;
            font-size: 11.5px; line-height: 1.7;
            color: hsl(var(--text-main));
            font-style: italic;
            min-height: 30px;
            display: flex; align-items: center; gap: 8px;
            position: relative;
        }
        .inner-voice-box .label {
            font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px;
            color: hsla(var(--secondary), 0.85);
            flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
            font-style: normal;
        }
        .inner-voice-box .label svg {
            width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .inner-voice-box > span:last-child { flex: 1; min-width: 0; }
        .inner-voice-box::after {
            content: '"';
            position: absolute; bottom: -2px; right: 9px;
            font-size: 26px; line-height: 1;
            color: hsla(var(--secondary), 0.18);
            font-family: Georgia, serif;
            pointer-events: none;
        }

        /* ---------- 秘密暴露度（细条，独占一行） ---------- */
        .env-strip { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 2px; }
        .env-strip .bar-item { flex: 1; grid-template-columns: 62px 1fr 34px; }

        /* ---------- 细线花饰 ---------- */
        .divider { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
        .divider .rule {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, hsla(var(--primary), 0.55), transparent);
        }
        .divider .floret { width: 12px; height: 12px; fill: none; stroke-width: 1.4; flex-shrink: 0; }
        .divider .floret .petal-a { stroke: hsl(var(--primary)); }
        .divider .floret .petal-b { stroke: hsl(var(--secondary)); }
        .divider .floret .core { fill: hsl(var(--secondary)); stroke: none; opacity: 0.6; }

        /* ---------- 卡片容器 ---------- */
        .cards-container { display: grid; grid-template-columns: var(--layout-cols); gap: 11px; }
        /* 玩家卡整行铺满，母亲与妹妹并排在上一行 */
        #userCard { grid-column: 1 / -1; }

        /* ---------- 单张角色卡 ---------- */
        .char-card {
            background: hsla(var(--bg-card), 0.62);
            border: 1px solid hsla(var(--primary), 0.26);
            border-left: 2px solid hsla(var(--primary), 0.55);
            border-radius: 16px;
            padding: 12px 13px 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }
        .char-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, hsla(var(--primary), 0.06), hsla(var(--secondary), 0.06));
            pointer-events: none; opacity: 0;
            transition: opacity 0.4s ease;
        }
        .char-card:hover {
            transform: translateY(-3px);
            border-color: hsla(var(--secondary), 0.5);
            box-shadow: 0 10px 26px hsla(24, 30%, 40%, 0.14);
        }
        .char-card:hover::before { opacity: 1; }
        .char-card.accent-rose { border-left-color: hsla(var(--secondary), 0.65); }
        .char-card.accent-sand { border-left-color: hsla(var(--primary), 0.85); }
        .char-card.accent-ink { border-left-color: hsla(var(--text-muted), 0.5); }

        /* ---------- 卡片头 ---------- */
        .char-header {
            display: flex; align-items: center; gap: 11px;
            margin-bottom: 8px; padding-bottom: 7px;
            border-bottom: 1px solid hsla(var(--primary), 0.16);
        }
        .char-header .avatar {
            flex-shrink: 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: hsla(var(--primary), 0.16);
            border: 1px solid hsla(var(--secondary), 0.45);
            box-shadow: 0 2px 10px hsla(24, 30%, 40%, 0.12);
            transition: all 0.3s ease;
            cursor: default;
        }
        .char-header .avatar:hover { border-color: hsla(var(--secondary), 0.8); }
        .char-header .avatar img {
            width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer;
        }
        .char-header .avatar .placeholder {
            font-size: 15px; font-weight: 700;
            color: hsl(var(--text-muted));
            opacity: 0.75;
            letter-spacing: 0;
        }
        #linCard .char-header .avatar { width: var(--avatar-width); height: var(--avatar-height); border-radius: var(--avatar-radius); }
        #ningCard .char-header .avatar { width: var(--ning-avatar-width); height: var(--ning-avatar-height); border-radius: var(--avatar-radius-ning); }
        #userCard .char-header .avatar { width: var(--user-avatar-width); height: var(--user-avatar-height); border-radius: var(--user-avatar-radius); }

        .char-header .info { flex: 1; min-width: 0; }
        .char-header .info .name {
            font-size: 13.5px; font-weight: 600; letter-spacing: 1px;
            color: hsl(var(--text-main));
        }
        .char-header .info .action {
            font-size: 10px; line-height: 1.5;
            color: hsl(var(--text-muted));
            margin-top: 2px;
            display: flex; align-items: flex-start; gap: 4px;
            overflow-wrap: anywhere;
        }
        .char-header .info .action svg {
            width: 11px; height: 11px; flex-shrink: 0; margin-top: 2px;
            fill: none; stroke: currentColor; stroke-width: 1.6;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .role-tag {
            flex-shrink: 0; align-self: flex-start;
            font-size: 9px; letter-spacing: 1px; line-height: 1.4;
            padding: 2px 5px;
            border-radius: 4px;
            color: hsl(var(--secondary));
            border: 1px solid hsla(var(--secondary), 0.45);
            background: hsla(var(--secondary), 0.07);
        }
        .char-card.accent-sand .role-tag {
            color: hsl(var(--primary));
            border-color: hsla(var(--primary), 0.55);
            background: hsla(var(--primary), 0.09);
        }
        .char-card.accent-ink .role-tag {
            color: hsl(var(--text-muted));
            border-color: hsla(var(--text-muted), 0.4);
            background: hsla(var(--text-muted), 0.06);
        }

        /* ---------- 数据行与细进度条 ---------- */
        .stat-row { display: grid; grid-template-columns: 1fr; gap: 0; margin-bottom: 5px; }
        .bar-item {
            display: grid;
            grid-template-columns: 46px 1fr 34px;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }
        .bar-item .label {
            font-size: 10px; letter-spacing: 1px;
            color: hsl(var(--text-muted));
            white-space: nowrap;
        }
        .bar-item .track {
            height: 2px;
            background: hsla(var(--primary), 0.24);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 0 hsla(0, 0%, 100%, 0.5);
        }
        .bar-item .track .fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            position: relative;
            transition: width 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .bar-item .track .fill::after {
            content: '';
            position: absolute; right: 0; top: 0;
            height: 100%; width: 10px;
            background: linear-gradient(to right, transparent, hsla(0, 0%, 100%, 0.85));
            border-radius: 3px;
        }
        .bar-item .track .fill.danger {
            background: linear-gradient(90deg, hsla(354, 32%, 46%, 0.72), hsla(354, 34%, 56%, 0.95));
        }
        .bar-item .track .fill.desire {
            background: linear-gradient(90deg, hsla(var(--secondary), 0.55), hsla(var(--secondary), 0.95));
        }
        .bar-item .track .fill.stress {
            background: linear-gradient(90deg, hsla(30, 34%, 46%, 0.62), hsla(30, 36%, 56%, 0.9));
        }
        .bar-item .track .fill.normal {
            background: linear-gradient(90deg, hsla(var(--primary), 0.6), hsla(var(--primary), 0.92));
        }
        .bar-item .val {
            font-family: 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: hsl(var(--ink));
        }

        /* ---------- 文字字段（穿搭 / 把柄 / 体液 / …） ---------- */
        .desc-block {
            margin-top: 7px;
            padding-top: 6px;
            border-top: 1px dashed hsla(var(--primary), 0.4);
            display: flex; flex-direction: column; gap: 4px;
        }
        .desc-block .desc-row {
            display: flex; align-items: baseline; gap: 7px;
            font-size: 10px; line-height: 1.65;
            color: hsl(var(--text-muted));
        }
        .desc-block .tag {
            flex-shrink: 0;
            font-size: 9px; letter-spacing: 1px;
            padding: 1px 6px;
            border-radius: 3px;
            background: hsla(var(--primary), 0.18);
            color: hsl(var(--text-main));
        }
        .desc-block .value {
            color: hsl(var(--text-main));
            opacity: 0.86;
            overflow-wrap: anywhere;
            min-width: 0;
        }
        .mono {
            font-family: 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
        }

        /* ---------- 最近接触 ---------- */
        .intimacy-log {
            margin-top: 11px;
            padding-top: 9px;
            border-top: 1px solid hsla(var(--primary), 0.3);
            display: flex; flex-direction: column; gap: 5px;
        }
        .intimacy-log .intimacy-row { display: flex; align-items: center; gap: 5px; }
        .intimacy-log .label {
            display: flex; align-items: center; gap: 5px;
            font-size: 9px; letter-spacing: 1.5px;
            color: hsl(var(--text-muted));
        }
        .intimacy-log .label svg {
            width: 11px; height: 11px; fill: none; stroke: currentColor;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }
        .intimacy-log .item {
            display: block;
            font-size: 10px; line-height: 1.7;
            padding: 5px 10px;
            border-radius: 8px;
            background: hsla(var(--primary), 0.13);
            border: 1px solid hsla(var(--primary), 0.26);
            color: hsl(var(--text-main));
            opacity: 0.92;
            overflow-wrap: anywhere;
        }

        /* ---------- 图片放大遮罩 ---------- */
        .img-overlay {
            position: fixed; inset: 0;
            background: hsla(24, 30%, 12%, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: none; align-items: center; justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .img-overlay.open { display: flex; opacity: 1; }
        .img-overlay img {
            max-width: 85vw; max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 60px hsla(24, 40%, 8%, 0.7);
            cursor: default;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .img-overlay.open img { transform: scale(1); }
        .img-overlay .close-hint {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: hsla(0, 0%, 100%, 0.42);
            font-size: 11px; letter-spacing: 2px;
            pointer-events: none;
        }

        /* ---------- 入场节奏 ---------- */
        .char-card:nth-child(1) { animation: cardIn 0.55s 0.08s both cubic-bezier(0.25, 0.8, 0.25, 1); }
        .char-card:nth-child(2) { animation: cardIn 0.55s 0.18s both cubic-bezier(0.25, 0.8, 0.25, 1); }
        .char-card:nth-child(3) { animation: cardIn 0.55s 0.28s both cubic-bezier(0.25, 0.8, 0.25, 1); }
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 560px) {
            /* 窄屏回落单列：三张卡纵向排，条不会被挤成一点 */
            .cards-container { grid-template-columns: 1fr; }
            #userCard { grid-column: auto; }
        }
        @media (max-width: 480px) {
            .status-wrapper { padding: 14px 12px 12px; border-radius: 22px; }
            .header-left .title { font-size: 10px; letter-spacing: 1px; max-width: 42vw; }
            .header-right { gap: 8px; font-size: 9.5px; }
            .header-right .loc span,
            .header-right .time span { max-width: 24vw; }
            .char-card { padding: 11px 11px 9px; border-radius: 14px; }
            .char-header .info .name { font-size: 12.5px; }
            .bar-item { grid-template-columns: 42px 1fr 32px; gap: 6px; }
            .env-strip .bar-item { grid-template-columns: 58px 1fr 30px; }
            #linCard .char-header .avatar { width: calc(var(--avatar-width) * 0.92); height: calc(var(--avatar-height) * 0.92); }
            #ningCard .char-header .avatar { width: calc(var(--ning-avatar-width) * 0.92); height: calc(var(--ning-avatar-height) * 0.92); }
            #userCard .char-header .avatar { width: calc(var(--user-avatar-width) * 0.92); height: calc(var(--user-avatar-height) * 0.92); }
            .img-overlay img { max-width: 90vw; max-height: 75vh; }
        }
        @media (min-width: 600px) {
            .status-wrapper { max-width: 620px; padding: 22px 20px 16px; border-radius: 30px; }
            .cards-container { gap: 13px; }
            .char-card { padding: 14px 15px 12px; border-radius: 18px; }
            .header-left .title { font-size: 13px; }
            .char-header .info .name { font-size: 14.5px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .status-wrapper, .char-card, .status-wrapper::before, .status-wrapper::after,
            .header-right .dot { animation: none !important; }
            /* 关掉动画后必须补回可见状态，否则 fadeUp 的起始 opacity:0 会留成隐形 */
            .status-wrapper { opacity: 1 !important; transform: none !important; }
            .char-card { opacity: 1 !important; transform: none !important; }
            .bar-item .track .fill { transition: none; }
        }

        /* ---------- 滚动条 ---------- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: hsla(var(--primary), 0.45); border-radius: 4px; }
    </style>
</head>
<body>

<div class="status-wrapper" id="statusApp">
    <!-- 隐藏数据容器：外链骨架会把正则捕获的纯文本注入这里，切勿删除 -->
    <div id="status-data" style="display: none;">$1</div>

    <!-- 顶栏：时间 / 地点 -->
    <div class="header">
        <div class="header-left">
            <svg class="floret" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="petal-a" cx="12" cy="7" r="3.1" />
                <circle class="petal-a" cx="12" cy="17" r="3.1" />
                <circle class="petal-b" cx="7" cy="12" r="3.1" />
                <circle class="petal-b" cx="17" cy="12" r="3.1" />
                <circle class="core" cx="12" cy="12" r="1.5" />
            </svg>
            <div class="title">雌小鬼的妹和欲求不满的妈</div>
        </div>
        <div class="header-right">
            <span class="loc">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="display-loc">锦华里·家里·客厅</span>
            </span>
            <span class="dot"></span>
            <span class="time">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="display-time">第一天 21点40分</span>
            </span>
            <button class="fold-btn" id="toggleFold" aria-label="折叠状态栏">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </div>
    </div>

    <!-- 家中气氛 -->
    <div class="inner-voice-box">
        <span class="label">
            <svg viewBox="0 0 24 24"><path d="M12 21c0-6 0-9 0-9"/><path d="M12 12c0-4 2-7 6-8 0 4-2 7-6 8z"/><path d="M12 15c0-3-2-5-6-6 0 3 2 5 6 6z"/></svg>
            家中气氛
        </span>
        <span id="display-mood">客厅没开灯，电视的光一闪一闪，谁都没先说话</span>
    </div>

    <!-- 秘密暴露度 -->
    <div class="env-strip">
        <div class="bar-item">
            <span class="label">秘密暴露度</span>
            <div class="track"><div class="fill danger" id="envSecretBar"></div></div>
            <span class="val" id="envSecretVal">0</span>
        </div>
    </div>

    <div class="divider" aria-hidden="true">
        <span class="rule"></span>
        <svg class="floret" viewBox="0 0 24 24">
            <circle class="petal-a" cx="12" cy="7" r="3.1" />
            <circle class="petal-a" cx="12" cy="17" r="3.1" />
            <circle class="petal-b" cx="7" cy="12" r="3.1" />
            <circle class="petal-b" cx="17" cy="12" r="3.1" />
            <circle class="core" cx="12" cy="12" r="1.5" />
        </svg>
        <span class="rule"></span>
    </div>

    <div class="cards-container">

        <!-- ===== 何锦怡 ===== -->
        <div class="char-card accent-rose" id="linCard">
            <div class="char-header">
                <div class="avatar" id="linAvatar"><span class="placeholder">锦</span></div>
                <div class="info">
                    <div class="name">何锦怡</div>
                    <div class="action">
                        <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-5"/></svg>
                        <span id="linBody">一米 · 成年比例缩小，脸还是四十岁</span>
                    </div>
                </div>
                <span class="role-tag">母</span>
            </div>

            <div class="stat-row">
                <div class="bar-item">
                    <span class="label">欲求</span>
                    <div class="track"><div class="fill desire" id="linDesireBar"></div></div>
                    <span class="val" id="linDesireVal">0</span>
                </div>
                <div class="bar-item">
                    <span class="label">疲惫</span>
                    <div class="track"><div class="fill stress" id="linFatigueBar"></div></div>
                    <span class="val" id="linFatigueVal">0</span>
                </div>
                <div class="bar-item">
                    <span class="label">演技</span>
                    <div class="track"><div class="fill normal" id="linMaskBar"></div></div>
                    <span class="val" id="linMaskVal">0</span>
                </div>
            </div>

            <div class="desc-block">
                <div class="desc-row"><span class="tag">穿搭</span><span class="value" id="linClothing">宽大的旧T恤，袖口盖到指尖</span></div>
            </div>
        </div>

        <!-- ===== 何宁宁 ===== -->
        <div class="char-card accent-sand" id="ningCard">
            <div class="char-header">
                <div class="avatar" id="ningAvatar"><span class="placeholder">宁</span></div>
                <div class="info">
                    <div class="name">何宁宁</div>
                    <div class="action">
                        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8"/><path d="M8 13h5"/><path d="M8 17h3"/></svg>
                        <span id="ningLeverage">把柄 2 条：尺寸的秘密 / 那杯牛奶</span>
                    </div>
                </div>
                <span class="role-tag">妹</span>
            </div>

            <div class="stat-row">
                <div class="bar-item">
                    <span class="label">敌意</span>
                    <div class="track"><div class="fill danger" id="ningHostileBar"></div></div>
                    <span class="val" id="ningHostileVal">0</span>
                </div>
                <div class="bar-item">
                    <span class="label">好奇</span>
                    <div class="track"><div class="fill desire" id="ningCuriousBar"></div></div>
                    <span class="val" id="ningCuriousVal">0</span>
                </div>
                <div class="bar-item">
                    <span class="label">黏度</span>
                    <div class="track"><div class="fill normal" id="ningStickyBar"></div></div>
                    <span class="val" id="ningStickyVal">0</span>
                </div>
            </div>

            <div class="desc-block">
                <div class="desc-row"><span class="tag">穿搭</span><span class="value" id="ningClothing">校服衬衫，领带松着，短袜拉到手肘</span></div>
            </div>
        </div>

        <!-- ===== {{user}} ===== -->
        <div class="char-card accent-ink" id="userCard">
            <div class="char-header">
                <div class="avatar" id="userAvatar"><span class="placeholder">你</span></div>
                <div class="info">
                    <div class="name" id="userDisplayName">你</div>
                    <div class="action">
                        <svg viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg>
                        <span class="mono" id="userSize">软 3cm · 硬 5cm</span>
                    </div>
                </div>
                <span class="role-tag">你</span>
            </div>

            <div class="stat-row">
                <div class="bar-item">
                    <span class="label">自卑</span>
                    <div class="track"><div class="fill danger" id="userShameBar"></div></div>
                    <span class="val" id="userShameVal">0</span>
                </div>
            </div>

            <div class="desc-block">
                <div class="desc-row"><span class="tag">体液</span><span class="value mono" id="userFluid">口水 0 · 淫水 0 · 尿 0</span></div>
                <div class="desc-row"><span class="tag">穿搭</span><span class="value" id="userClothing">宿舍T恤，运动裤，拖鞋</span></div>
            </div>
        </div>

    </div>

    <!-- 最近接触 -->
    <div class="intimacy-log">
        <div class="intimacy-row">
            <span class="label">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                最近接触
            </span>
        </div>
        <div class="intimacy-row">
            <span class="item" id="display-contact">她把空牛奶杯放回托盘，手指在杯沿上停了一下</span>
        </div>
    </div>
</div>

<!-- 放大图片遮罩层 -->
<div class="img-overlay" id="imageOverlay">
    <img id="overlayImg" src="" alt="头像" />
    <div class="close-hint">点击任意位置关闭</div>
</div>

<script>
(function() {
    'use strict';

    // =========================================================================
    // 数据入口：只从隐藏容器读，绝不直接读 '$1' 字面量
    // （外链骨架会把正则捕获的文本写进 #status-data）
    // =========================================================================
    var dataContainer = document.getElementById('status-data');
    if (!dataContainer) return;
    var rawYaml = dataContainer.textContent.trim();

    // -------------------------------------------------------------------------
    // 工具：按行取 key: value
    // -------------------------------------------------------------------------
    function extractVal(lines, key) {
        for (var i = 0; i < lines.length; i++) {
            var t = lines[i].trim();
            if (t.indexOf(key + ':') === 0) {
                var val = t.substring(key.length + 1).trim();
                if (val.length >= 2 && val.charAt(0) === '"' && val.charAt(val.length - 1) === '"') {
                    val = val.substring(1, val.length - 1);
                }
                if (val.length >= 2 && val.charAt(0) === "'" && val.charAt(val.length - 1) === "'") {
                    val = val.substring(1, val.length - 1);
                }
                return val;
            }
        }
        return '';
    }

    function toInt(v) {
        var s = String(v == null ? '' : v);
        var m = s.match(/-?\d+/);
        if (!m) return 0;
        var n = parseInt(m[0], 10);
        return isNaN(n) ? 0 : n;
    }

    // -------------------------------------------------------------------------
    // 智能解析器：一次性遍历所有 `- 用户:` 块
    //   · NPC 用位置匹配（不依赖 NPC 名字写得对不对）
    //   · 玩家用名字特征匹配（{{user}} / 你 / 玩家），找不到则取最后一个块
    //   · 名字纠偏：万一 AI 把锦怡和宁宁写反了，按名字换回来
    // -------------------------------------------------------------------------
    function parseAllBlocks(lines) {
        var blocks = [];
        var current = null;
        var blockStart = -1;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var tLine = line.trim();

            if (tLine.indexOf('- 用户:') === 0) {
                if (current) blocks.push(current);
                current = { intimacy: [] };
                blockStart = i;
                continue;
            }

            if (current && blockStart !== -1) {
                // 遇到顶格的新行，说明这个块结束了
                if (i > blockStart && line.charAt(0) !== ' ' && line.charAt(0) !== '\t' && tLine !== '' && tLine.charAt(0) !== '-') {
                    blockStart = -1;
                    continue;
                }

                if (tLine.indexOf('名字:') === 0) current.name = extractVal([line], '名字');
                else if (tLine.indexOf('头像:') === 0) current.avatar = extractVal([line], '头像');
                else if (tLine.indexOf('穿搭:') === 0) current.clothing = extractVal([line], '穿搭');
                else if (tLine.indexOf('体型:') === 0) current.body = extractVal([line], '体型');
                else if (tLine.indexOf('欲求:') === 0) current.desire = toInt(extractVal([line], '欲求'));
                else if (tLine.indexOf('疲惫:') === 0) current.fatigue = toInt(extractVal([line], '疲惫'));
                else if (tLine.indexOf('演技:') === 0) current.mask = toInt(extractVal([line], '演技'));
                else if (tLine.indexOf('敌意:') === 0) current.hostile = toInt(extractVal([line], '敌意'));
                else if (tLine.indexOf('好奇:') === 0) current.curious = toInt(extractVal([line], '好奇'));
                else if (tLine.indexOf('把柄:') === 0) current.leverage = extractVal([line], '把柄');
                else if (tLine.indexOf('黏度:') === 0) current.sticky = toInt(extractVal([line], '黏度'));
                else if (tLine.indexOf('自卑:') === 0) current.shame = toInt(extractVal([line], '自卑'));
                else if (tLine.indexOf('药水余量:') === 0) current.potion = extractVal([line], '药水余量');
                else if (tLine.indexOf('体液收集:') === 0) current.fluid = extractVal([line], '体液收集');
                else if (tLine.indexOf('尺寸:') === 0) current.size = extractVal([line], '尺寸');

                // 兼容旧写法：块内若出现「- 亲密行为:」也收下来（本卡不上屏，不丢数据）
                if (tLine.indexOf('- 亲密行为:') === 0) {
                    var iv = tLine.substring('- 亲密行为:'.length).trim();
                    if (iv.length >= 2 && iv.charAt(0) === '"' && iv.charAt(iv.length - 1) === '"') iv = iv.substring(1, iv.length - 1);
                    current.intimacy.push(iv || '无');
                }
            }
        }
        if (current) blocks.push(current);

        // 补默认值，保证界面永远不出现 undefined
        function fillDefaults(b) {
            if (!b) return null;
            if (!b.name) b.name = '未知';
            if (typeof b.avatar !== 'string') b.avatar = '';
            if (!b.clothing) b.clothing = '常服';
            if (!b.body) b.body = '';
            if (!b.leverage) b.leverage = '';
            if (!b.fluid) b.fluid = '口水 0 · 淫水 0 · 尿 0';
            if (!b.size) b.size = '软 3cm · 硬 5cm';
            if (typeof b.desire !== 'number') b.desire = 0;
            if (typeof b.fatigue !== 'number') b.fatigue = 0;
            if (typeof b.mask !== 'number') b.mask = 0;
            if (typeof b.hostile !== 'number') b.hostile = 0;
            if (typeof b.curious !== 'number') b.curious = 0;
            if (typeof b.sticky !== 'number') b.sticky = 0;
            if (typeof b.shame !== 'number') b.shame = 0;
            if (typeof b.potion !== 'string') b.potion = '';
            if (!b.intimacy || b.intimacy.length === 0) b.intimacy = ['无', '无'];
            return b;
        }

        // 1. 玩家：名字特征匹配
        var userIdx = -1;
        for (var j = 0; j < blocks.length; j++) {
            var nm = String(blocks[j].name || '').trim();
            if (nm === '{{user}}' || nm === '你' || nm === '玩家') { userIdx = j; break; }
        }
        // 2. 玩家兜底：取最后一个块（绝对优先级法，禁止写死「第二个块」）
        if (userIdx === -1 && blocks.length > 0) userIdx = blocks.length - 1;

        var userBlock = (userIdx >= 0) ? blocks[userIdx] : null;

        // 3. NPC：按出现顺序分配，跳过玩家块
        var queue = [];
        for (var k = 0; k < blocks.length; k++) {
            if (k !== userIdx) queue.push(blocks[k]);
        }
        var momBlock = queue[0] || null;
        var sisBlock = queue[1] || null;

        // 4. 名字纠偏：顺序被写反时按名字换回来
        if (momBlock && sisBlock) {
            var momName = String(momBlock.name || '');
            var sisName = String(sisBlock.name || '');
            if (momName.indexOf('宁宁') >= 0 && sisName.indexOf('宁宁') < 0) {
                var tmp = momBlock;
                momBlock = sisBlock;
                sisBlock = tmp;
            }
        }
        // 5. 只有一个 NPC 块时，那份数据归锦怡，宁宁走默认值
        return {
            mom: fillDefaults(momBlock),
            sis: fillDefaults(sisBlock),
            user: fillDefaults(userBlock)
        };
    }

    // -------------------------------------------------------------------------
    // 渲染工具
    // -------------------------------------------------------------------------
    function setText(id, text) {
        var el = document.getElementById(id);
        if (!el) return;
        if (text === undefined || text === null || text === '') {
            el.textContent = '—';
            return;
        }
        el.textContent = String(text);
    }

    function setBar(id, value) {
        var el = document.getElementById(id);
        if (!el) return;
        var v = toInt(value);
        el.style.width = Math.min(100, Math.max(0, v)) + '%';
    }

    // 药水余量：YAML 给 0-5 的整数，条按 /5 折算，数字写 n/5
    function setPotion(raw) {
        var bar = document.getElementById('userPotionBar');
        var val = document.getElementById('userPotionVal');
        var s = String(raw == null ? '' : raw).trim();
        var m = s.match(/\d+/);
        if (!m) {
            if (bar) bar.style.width = '0%';
            if (val) val.textContent = '—/5';
            return;
        }
        var n = parseInt(m[0], 10);
        if (isNaN(n)) n = 0;
        n = Math.max(0, Math.min(5, n));
        if (bar) bar.style.width = (n / 5 * 100) + '%';
        if (val) val.textContent = n + '/5';
    }

    function renderAvatar(divId, data, fallbackChar, displayName) {
        var div = document.getElementById(divId);
        if (!div) return;
        if (data && data.avatar) {
            div.innerHTML = '<img src="' + data.avatar + '" alt="' + (displayName || '') + '" />';
            var img = div.querySelector('img');
            if (img) {
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openImage(this.src);
                });
            }
        } else {
            div.innerHTML = '<span class="placeholder">' + fallbackChar + '</span>';
        }
    }

    // -------------------------------------------------------------------------
    // 取数：全局 4 项 + 最近接触
    // -------------------------------------------------------------------------
    var lines = rawYaml.split('\n');

    var timeText = extractVal(lines, '时间') || extractVal(lines, '日期和时间') || '——';
    var locText = extractVal(lines, '地点') || '——';
    var moodText = extractVal(lines, '家中气氛') || '——';
    var secretRaw = extractVal(lines, '秘密暴露度');
    var secretVal = toInt(secretRaw);
    var contactText = extractVal(lines, '最近接触') || '——';

    var result = parseAllBlocks(lines);
    var momData = result.mom || {};
    var sisData = result.sis || {};
    var userData = result.user || {};

    // -------------------------------------------------------------------------
    // 渲染：环境
    // -------------------------------------------------------------------------
    setText('display-time', timeText);
    setText('display-loc', locText);
    setText('display-mood', moodText);
    setBar('envSecretBar', secretRaw === '' ? 0 : secretVal);
    setText('envSecretVal', secretRaw === '' ? '—' : secretVal);
    setText('display-contact', contactText);

    // -------------------------------------------------------------------------
    // 渲染：何锦怡
    // -------------------------------------------------------------------------
    setText('linBody', momData.body || '——');
    setBar('linDesireBar', momData.desire);
    setText('linDesireVal', momData.desire);
    setBar('linFatigueBar', momData.fatigue);
    setText('linFatigueVal', momData.fatigue);
    setBar('linMaskBar', momData.mask);
    setText('linMaskVal', momData.mask);
    setText('linClothing', momData.clothing || '——');
    renderAvatar('linAvatar', momData, '锦', '何锦怡');

    // -------------------------------------------------------------------------
    // 渲染：何宁宁
    // -------------------------------------------------------------------------
    setText('ningLeverage', sisData.leverage || '——');
    setBar('ningHostileBar', sisData.hostile);
    setText('ningHostileVal', sisData.hostile);
    setBar('ningCuriousBar', sisData.curious);
    setText('ningCuriousVal', sisData.curious);
    setBar('ningStickyBar', sisData.sticky);
    setText('ningStickyVal', sisData.sticky);
    setText('ningClothing', sisData.clothing || '——');
    renderAvatar('ningAvatar', sisData, '宁', '何宁宁');

    // -------------------------------------------------------------------------
    // 渲染：{{user}}
    // -------------------------------------------------------------------------
    var userName = userData.name ? String(userData.name).trim() : '';
    if (!userName || userName === '{{user}}' || userName === '你' || userName === '玩家') userName = '你';
    setText('userDisplayName', userName);
    setText('userSize', userData.size || '软 3cm · 硬 5cm');
    setBar('userShameBar', userData.shame);
    setText('userShameVal', userData.shame);
    setPotion(userData.potion);
    setText('userFluid', userData.fluid || '口水 0 · 淫水 0 · 尿 0');
    setText('userClothing', userData.clothing || '——');
    renderAvatar('userAvatar', userData, '你', userName);

    // -------------------------------------------------------------------------
    // 折叠 / 展开（带记忆）
    // -------------------------------------------------------------------------
    var foldBtn = document.getElementById('toggleFold');
    var wrapper = document.getElementById('statusApp');
    if (foldBtn && wrapper) {
        try {
            if (localStorage.getItem('statusbar_folded') === 'true') wrapper.classList.add('collapsed');
        } catch (err) { /* 隐私模式忽略 */ }

        foldBtn.addEventListener('click', function() {
            wrapper.classList.toggle('collapsed');
            try {
                localStorage.setItem('statusbar_folded', wrapper.classList.contains('collapsed') ? 'true' : 'false');
            } catch (err) { /* 隐私模式忽略 */ }
        });
    }

    // -------------------------------------------------------------------------
    // 头像放大
    // -------------------------------------------------------------------------
    var overlay = document.getElementById('imageOverlay');
    var overlayImg = document.getElementById('overlayImg');

    window.openImage = function(src) {
        if (src && overlay && overlayImg) {
            overlayImg.src = src;
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
    };

    function closeImage() {
        if (overlay) {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }
    }

    if (overlay) {
        overlay.addEventListener('click', closeImage);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && overlay.classList.contains('open')) closeImage();
        });
    }

})();
</script>

</body>
</html>
